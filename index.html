<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header class="header">
        <div class="container">
            <h1>Capanema Jovem</h1>
            <p>Conectando talentos da nossa região que estão a procura de seu primeiro emprego!</p>
        </div>
    </header>
    <main>
        <section>
            <div class="form_group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Digite seu nome completo">
            </div>
        
             <div class="form_group">
                <label for="nascimento">Data de Nascimento</label>
                <input type="date" id="nascimento" required placeholder="Digite sua data de nascimento">
            </div>

             <div class="form_group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" required placeholder="(46) 99999-9999">
            </div>

             <div class="form_group">
                <label for="email">Seu Email</label>
                <input type="email" id="email" required placeholder="seuemail@exemplo.com">
            </div>
            
            </section>
            
            <section>
            <div>
                
            <div class="form-group">
            <label for="escolaridade">Escolaridade:*</label>
            <select id="escolaridade" name="escolaridade" required>
              <option value="">Selecione sua escolaridade</option>
              <option value="fundamental-cursando">Ensino Fundamental (Cursando)</option>
              <option value="medio-cursando">Ensino Médio (Cursando)</option>
              <option value="medio-concluido">Ensino Médio (Concluído)</option>
              <option value="superior-cursando">Ensino Superior (Cursando)</option>
            </select>
          </div>
          
          <div>
            <div class="form-group">
            <label for="resumo">Resumo Pessoal / Objetivos:</label>
            <textarea id="resumo" name="resumo" rows="4" placeholder="Fale um pouco sobre suas habilidades, cursos ou objetivos para o primeiro emprego..."></textarea>
          </div>
        </fieldset>
        </section>
        <button type="submit" class="btn-submit">Enviar Inscrição</button>
        </form>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Projeto Primeiro Emprego - Município de Capanema/PR</p>
        </footer>
    </main>
</body>
</html>
